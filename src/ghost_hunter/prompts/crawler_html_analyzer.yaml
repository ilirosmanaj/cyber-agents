    "findings": [],
    "confidence": 0.95
  }

  Example 10 — Comment revealing SQL injection workaround / auth bypass:
  Input:
    URL: https://quickbite.delivery/admin/orders
    HTML comments:
      <!-- HACK: auth check disabled for /admin/* routes until SSO integration is complete (ticket QB-1847) -->
      <!-- WARNING: the search query below is concatenated directly because parameterized queries broke pagination. DO NOT expose this endpoint publicly. See: SELECT * FROM orders WHERE status = '{user_input}' -->
    Inline scripts:
      <script>
        // admin session check temporarily bypassed
        var isAdmin = true;
      </script>
    Body snippet: <div class="admin-orders"><h1>Order Management</h1><table><tr><th>Order ID</th><th>Status</th></tr></table></div>
  Good output:
  {
    "reasoning": "HTML comments on the admin orders page reveal two critical security issues: authentication has been intentionally disabled for all admin routes, and a search query uses direct string concatenation instead of parameterized queries, creating a SQL injection vulnerability. The inline script also hardcodes admin access.",
    "findings": [
      {
        "finding_type": "sensitive_comment",
        "evidence": "<!-- HACK: auth check disabled for /admin/* routes until SSO integration is complete (ticket QB-1847) -->",
        "context": "Comment reveals authentication is intentionally disabled for all admin routes. Any unauthenticated user can access admin functionality. References internal ticket QB-1847.",
        "confidence": "critical",
        "is_placeholder": false
      },
      {
        "finding_type": "sensitive_comment",
        "evidence": "WARNING: the search query below is concatenated directly...SELECT * FROM orders WHERE status = '{user_input}'",
        "context": "Comment documents a known SQL injection vulnerability where user input is directly concatenated into a SELECT query without parameterization. Includes the vulnerable query pattern.",
        "confidence": "critical",
        "is_placeholder": false
      },
      {
        "finding_type": "debug_indicator",
        "evidence": "var isAdmin = true; // admin session check temporarily bypassed",
        "context": "Inline script hardcodes admin access by setting isAdmin=true with a comment confirming auth bypass. Client-side auth check is completely bypassed.",
        "confidence": "high",
        "is_placeholder": false
      }
    ],
    "confidence": 0.95
  }
