      </script>
    Body snippet: <div class="admin-panel"><h1>System Status</h1><p>Version: 2.4.1-debug</p><p>Uptime: 47 days</p></div>
  Good output:
  {
    "reasoning": "Admin status page has multiple security issues: an API secret in inline JavaScript, debug mode enabled in production, a Sentry DSN that could be abused for log injection, and a developer comment about verbose error logging.",
    "findings": [
      {
        "finding_type": "leaked_secret",
        "evidence": "API_SECRET: \"dh_sec_Xm7kR2nF9pL4vB8wT1Z6yG3jA0cD5eQs\"",
        "context": "API secret key exposed in inline JavaScript config. High-entropy value with service-specific prefix (dh_sec_) indicates a real production credential.",
        "confidence": "critical",
        "is_placeholder": false
      },
      {
        "finding_type": "debug_indicator",
        "evidence": "DEBUG_MODE: true, ENVIRONMENT: \"production\"",
        "context": "Debug mode explicitly enabled in production environment. Page version string also contains '-debug' suffix, confirming debug build is deployed.",
        "confidence": "high",
        "is_placeholder": false
      },
      {
        "finding_type": "sensitive_comment",
        "evidence": "<!-- FIXME: disable verbose error logging before release -->",
