    Inline scripts:
      <script>
        window.DEVHUB_ENV = {
          API_SECRET: "dh_sec_Xm7kR2nF9pL4vB8wT1Z6yG3jA0cD5eQs",
          ENVIRONMENT: "production",
          DEBUG_MODE: true,
          SENTRY_DSN: "https://abc123@o456.ingest.sentry.io/789",
