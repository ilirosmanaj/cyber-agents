[project]
name = "ghost-hunter"
version = "0.1.0"
description = "AI-powered API endpoint discovery and attack surface mapping tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "groq>=0.11",
    "langfuse>=2.40",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "rich>=13.7",
    "click>=8.1",
    "aiolimiter>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
